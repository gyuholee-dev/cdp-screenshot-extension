<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDP Screenshot 설정</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>CDP Screenshot 설정</h1>

    <form id="form">
      <label>
        <span class="ti">깊이(depth)</span>
        <input id="depth" type="number" min="0" step="1" required>
        <span class="hint">스크롤 컨테이너를 찾을 깊이. 전체는 body, 엘리먼트는 고른 요소가 0입니다.</span>
      </label>

      <label>
        <span class="ti">형식</span>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
        </select>
      </label>

      <label>
        <span class="ti">안정화 대기(ms)</span>
        <input id="settleMs" type="number" min="0" step="50" required>
        <span class="hint">지연 로딩 이미지나 스크롤 연동 애니메이션이 빠지면 늘립니다.</span>
      </label>

      <label>
        <span class="ti">저장 방식</span>
        <select id="saveMode">
          <option value="download">다운로드 폴더</option>
          <option value="clipboard">클립보드</option>
        </select>
      </label>

      <div class="row">
        <button type="submit">저장</button>
        <span id="saved" class="hint" role="status"></span>
      </div>
    </form>

    <section>
      <h2>단축키</h2>
      <p class="hint">Chrome 주소창에 <code>chrome://extensions/shortcuts</code>를 입력해 바꿉니다. 기본값: Alt+Shift+1 스크린샷, Alt+Shift+2 전체, Alt+Shift+3 엘리먼트.</p>
    </section>

    <section>
      <h2>최근 결과</h2>
      <p id="status" class="hint">아직 없습니다.</p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
