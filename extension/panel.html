<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDP Screenshot</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="views" class="views">
  <div class="views__track">
  <div id="mainView" class="view">
    <header class="hdr">
      <div class="tools">
        <button id="viewport" data-kind="viewport" data-i18n-title="capture.viewport.title" data-i18n="capture.viewport"></button>
        <button id="full" data-kind="full" data-i18n-title="capture.full.title" data-i18n="capture.full"></button>
        <button id="element" data-kind="element" data-i18n-title="capture.element.title" data-i18n="capture.element"></button>
      </div>
      <button id="toSettings" class="sq" data-i18n-title="settings.open" data-i18n-aria-label="settings.open"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
    </header>

    <div id="alert" class="alert" inert>
      <div class="alert__inner">
        <div class="statusrow"><p id="status" role="status"></p><button id="cancel" hidden data-i18n="alert.cancel"></button></div>
      </div>
    </div>

    <main id="mainBody" class="body">
      <ul id="list"></ul>
      <p id="empty" class="hint" data-i18n="history.empty"></p>
    </main>
  </div>

  <div id="settingsView" class="view" inert>
    <header class="hdr">
      <button id="toMain" class="sq" data-i18n-title="settings.back" data-i18n-aria-label="settings.back"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h1 data-i18n="settings.title"></h1>
    </header>

    <main class="body">
      <section class="fgroup box">
        <div class="fgroup__head"><h2 class="fgroup__title" data-i18n="group.capture"></h2></div>
        <div class="fld">
          <label class="fld__label" for="format" data-i18n="format.label"></label>
          <div class="fld__select">
            <select id="format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
            <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="fld fld--note">
          <label class="fld__label" for="depth" data-i18n="depth.label"></label>
          <input id="depth" class="fld__text num" type="number" min="0" step="1">
          <p class="fld__note sub" data-i18n="depth.note"></p>
        </div>
        <div class="fld fld--note">
          <label class="fld__label" for="settleMs" data-i18n="settle.label"></label>
          <input id="settleMs" class="fld__text num" type="number" min="0" step="50">
          <p class="fld__note sub" data-i18n="settle.note"></p>
        </div>
      </section>

      <section class="fgroup box">
        <div class="fgroup__head"><h2 class="fgroup__title" data-i18n="group.save"></h2></div>
        <div class="fld fld--note">
          <label class="fld__label" for="afterAction" data-i18n="afterAction.label"></label>
          <div class="fld__select">
            <select id="afterAction">
              <option value="history" data-i18n="afterAction.history"></option>
              <option value="save" data-i18n="afterAction.save"></option>
            </select>
            <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="fld__note sub" data-i18n="afterAction.note"></p>
        </div>
        <div class="fld fld--stack">
          <label class="fld__label" for="dirName" data-i18n="dir.label"></label>
          <div class="pr">
            <input id="dirName" class="fld__box" type="text" readonly data-i18n-placeholder="dir.placeholder">
            <button id="allowDir" hidden data-i18n="dir.allow"></button>
            <button id="pickDir" data-i18n="dir.pick"></button>
          </div>
        </div>
      </section>

      <section class="fgroup box">
        <div class="fgroup__head"><h2 class="fgroup__title" data-i18n="group.history"></h2></div>
        <div class="fld fld--note">
          <label class="fld__label" for="historyImageSize" data-i18n="imageSize.label"></label>
          <input id="historyImageSize" class="fld__text num" type="number" min="256" max="1024" step="1">
          <p class="fld__note sub" data-i18n="imageSize.note"></p>
        </div>
        <div class="fld fld--note">
          <label class="fld__label" for="retentionDays" data-i18n="retention.label"></label>
          <input id="retentionDays" class="fld__text num" type="number" min="0" step="1">
          <p class="fld__note sub" data-i18n="retention.note"></p>
        </div>
        <div class="fld">
          <span class="fld__label" data-i18n="clear.label"></span>
          <span class="fld__group"><span id="historyStats" class="sub"></span><button id="clearAll" class="small" data-i18n="clear.button"></button></span>
        </div>
      </section>

      <section class="fgroup box" id="effects">
        <div class="fgroup__head">
          <h2 class="fgroup__title" data-i18n="group.effects"></h2>
          <p class="fgroup__note sub" data-i18n-html="effects.note"></p>
        </div>
        <div class="fld">
          <label class="fld__label" for="flashOn" data-i18n="flash.label"></label>
          <input type="checkbox" id="flashOn" class="sw">
        </div>
        <div class="fld fld--stack">
          <textarea id="flashCss" class="fld__box" rows="2" spellcheck="false" data-i18n-aria-label="flash.cssLabel"></textarea>
          <div class="btns"><button id="flashTest" data-i18n="flash.test"></button><button id="flashReset" data-i18n="effects.reset"></button></div>
        </div>
        <div class="fld">
          <label class="fld__label" for="edgeOn" data-i18n="edge.label"></label>
          <input type="checkbox" id="edgeOn" class="sw">
        </div>
        <div class="fld fld--stack">
          <textarea id="edgeCss" class="fld__box" rows="3" spellcheck="false" data-i18n-aria-label="edge.cssLabel"></textarea>
          <div class="btns"><button id="edgeTest" data-i18n="edge.test"></button><button id="edgeReset" data-i18n="effects.reset"></button></div>
        </div>
      </section>

      <section class="fgroup box">
        <div class="fgroup__head">
          <h2 class="fgroup__title" data-i18n="group.shortcuts"></h2>
          <p class="fgroup__note sub" data-i18n-html="shortcuts.note"></p>
        </div>
        <div class="fld"><span class="fld__label" data-i18n="capture.viewport"></span><kbd>Alt+Shift+1</kbd></div>
        <div class="fld"><span class="fld__label" data-i18n="capture.full"></span><kbd>Alt+Shift+2</kbd></div>
        <div class="fld"><span class="fld__label" data-i18n="capture.element"></span><kbd>Alt+Shift+3</kbd></div>
        <div class="fld"><span class="fld__label" data-i18n="shortcut.panel"></span><kbd>Alt+Shift+S</kbd></div>
      </section>
    </main>

    <footer>
      <span id="saved" class="sub" role="status"></span>
      <button id="resetAll" data-i18n="footer.reset"></button>
      <button id="save" class="primary" data-i18n="footer.save"></button>
    </footer>
  </div>
  </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
