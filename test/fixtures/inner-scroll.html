<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inner-scroll: 문서가 아니라 조상 요소가 스크롤되는 레이아웃</title>
<style>
  * { box-sizing: border-box; }
  /* 앱 형태의 뼈대: body는 100dvh에 overflow:hidden, 본문(.content)이 안쪽에서 스크롤 */
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  header { padding: 12px 16px; background: #1b1b1b; flex: none; }
  .content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 16px 16px; scrollbar-gutter: stable; }
  .section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #333; }
  .section__title { margin: 10px 0; font-weight: 600; }
  .card { background: #222; border: 1px solid #333; border-radius: 12px; padding: 14px; }
  .capped { max-height: 180px; margin: 0 -14px; padding: 0 14px; scrollbar-gutter: stable; overflow-x: hidden; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: .75rem/20px ui-monospace, Menlo, monospace; color: #aaa; }
  .row { min-height: 20px; }
  .fill { height: 300px; background: #1a2230; border-radius: 8px; }
</style>
</head>
<body>
<header>문서가 아니라 .content가 스크롤된다. .card(max-height 스크롤 요소 포함)를 요소 캡처로 찍는다.</header>
<main class="content" id="content">
  <div class="section"><div class="section__title">위쪽 영역</div><div class="fill"></div></div>
  <div class="section"><div class="section__title">아래쪽 영역</div><div class="card" id="card"><div class="capped" id="capped"></div></div></div>
</main>
<script>
  const el = document.getElementById('capped');
  for (let i = 1; i <= 30; i++) {
    const d = document.createElement('div');
    d.className = 'row';
    d.textContent = `row ${i}: sample text that is long enough to wrap onto a second line in a narrow box (line ${i})`;
    el.append(d);
  }
  el.scrollTop = el.scrollHeight;
  document.getElementById('content').scrollTop = 1e6;
</script>
</body>
</html>
