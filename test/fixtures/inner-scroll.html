<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inner-scroll: 문서가 아니라 조상 요소가 스크롤되는 앱 레이아웃</title>
<style>
  * { box-sizing: border-box; }
  /* 앱(ollama-multi-manager)과 같은 뼈대: body는 100dvh에 overflow:hidden, 본문(.dbody)이 안쪽에서 스크롤 */
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  header { padding: 12px 16px; background: #1b1b1b; flex: none; }
  .dbody { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 16px 16px; scrollbar-gutter: stable; }
  .mpart { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #333; }
  .mpart__title { margin: 10px 0; font-weight: 600; }
  .card { background: #222; border: 1px solid #333; border-radius: 12px; padding: 14px; }
  .ilog { max-height: 180px; margin: 0 -14px; padding: 0 14px; scrollbar-gutter: stable; overflow-x: hidden; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: .75rem/20px ui-monospace, Menlo, monospace; color: #aaa; }
  .logl { min-height: 20px; }
  .fill { height: 300px; background: #1a2230; border-radius: 8px; }
</style>
</head>
<body>
<header>앱 레이아웃: 문서가 아니라 .dbody가 스크롤된다. .card(로그 상자 포함)를 요소 스크린샷으로 찍는다.</header>
<main class="dbody" id="dbody">
  <div class="mpart"><div class="mpart__title">요약</div><div class="fill"></div></div>
  <div class="mpart"><div class="mpart__title">내역</div><div class="card" id="card"><div class="ilog" id="ilog"></div></div></div>
</main>
<script>
  const el = document.getElementById('ilog');
  for (let i = 1; i <= 30; i++) {
    const d = document.createElement('div');
    d.className = 'logl';
    d.textContent = `[22:00:${String(i).padStart(2, '0')}] time=2026-11-15T22:00:${String(i).padStart(2, '0')}.536+09:00 level=INFO source=routes.go:${1900 + i} msg="server config line ${i}"`;
    el.append(d);
  }
  el.scrollTop = el.scrollHeight;
  document.getElementById('dbody').scrollTop = 1e6;
</script>
</body>
</html>
